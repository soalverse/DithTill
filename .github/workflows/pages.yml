name: Web app

# Publishing a GitHub release also publishes the web app, so the site and the installers always
# match. Nothing goes online while a release is still a draft.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: build + publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # The model is about 170 MB: fetch it once, not once per release.
      - uses: actions/cache@v4
        with:
          path: public/models
          key: bg-model-${{ hashFiles('scripts/fetch-bg-model.mjs') }}
      - run: npm ci
      # Stops the deploy if the model or the ONNX files are missing and cannot be fetched.
      - run: node scripts/check-bundled-assets.mjs
      - run: npm run build
      # The landing page goes at the root and the app at /app/, on the site only.
      - run: node scripts/place-landing.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
